<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cockpit</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a id="brand" class="brand" href="#/" aria-label="Ir al inicio del cockpit">Cockpit</a>
    <span id="top-title" class="top-title"></span>
    <div class="topbar-right">
      <span id="live-pill" class="pill pill-warn" hidden>reconectando…</span>
      <button id="btn-talk" class="btn btn-ghost btn-top" type="button" aria-label="Conversar sobre esta revisión" title="Conversar sobre esta revisión" hidden></button>
      <a id="btn-uso" class="btn btn-ghost btn-top" href="#/uso">Uso</a>
      <a id="btn-help" class="btn btn-help btn-top" href="#/ayuda">Qué puedo pedir</a>
    </div>
  </header>

  <main id="view-home" class="home">
    <h1 id="home-title" class="home-title"></h1>
    <section id="timeline" class="tl" aria-label="Línea de tiempo de sprints"></section>
  </main>

  <main id="view-help" class="help" hidden>
    <h1 class="home-title">Qué puedo pedir</h1>
    <div id="help-cards" class="help-cards"></div>
  </main>

  <main id="view-uso" class="help uso" hidden></main>

  <section id="view-deck" class="deck" hidden aria-label="Presentación de la revisión">
    <div id="changed-banner" class="banner" hidden>
      Esta revisión cambió. <button id="reload-review" class="btn btn-small" type="button">Recargar</button>
    </div>
    <div id="deck-stage" class="deck-stage"></div>
    <div id="comment-pop" class="comment-pop" hidden>
      <textarea id="comment-input" rows="3" placeholder="Tu comentario…" aria-label="Comentario"></textarea>
    </div>
    <footer class="deck-bar">
      <div id="deck-actions" class="deck-actions">
        <span id="slide-ask" class="slide-ask"></span>
        <button id="vote-up" class="vote vote-up" type="button" aria-label="Me gusta" title="Me gusta"></button>
        <button id="vote-down" class="vote vote-down" type="button" aria-label="No me gusta" title="No me gusta"></button>
        <button id="btn-comment" class="vote vote-comment" type="button" aria-label="Comentar" title="Comentar"></button>
        <button id="btn-more" class="btn btn-more" type="button">Ver más</button>
      </div>
      <div class="deck-nav">
        <button id="deck-prev" class="nav-btn" type="button" aria-label="Lámina anterior"></button>
        <div id="deck-dots" class="deck-dots" role="tablist" aria-label="Láminas"></div>
        <button id="deck-next" class="nav-btn" type="button" aria-label="Lámina siguiente"></button>
      </div>
      <div class="deck-save">
        <span id="save-status" class="save-status" aria-live="polite"></span>
        <button id="btn-save" class="btn btn-small" type="button" aria-label="Guardar feedback" hidden>Guardar</button>
      </div>
    </footer>
    <aside id="more-sheet" class="more-sheet" hidden aria-label="Más detalle">
      <div class="more-head">
        <strong id="more-title"></strong>
        <button id="more-close" class="btn btn-small" type="button">Cerrar</button>
      </div>
      <div id="more-body" class="more-body"></div>
    </aside>
  </section>

  <aside id="talk" class="talk" hidden aria-label="Conversación">
    <div class="talk-head">
      <div>
        <strong>Conversación guiada</strong>
        <span id="talk-mode" class="pill pill-muted"></span>
        <span id="talk-timer" class="talk-timer"></span>
      </div>
      <button id="talk-close" class="btn btn-small" type="button" aria-label="Cerrar">Cerrar</button>
    </div>
    <div id="voice-orb" class="voice-orb" hidden><span></span></div>
    <div id="talk-log" class="talk-log" aria-live="polite"></div>
    <form id="talk-form" class="talk-form" hidden>
      <input id="talk-input" type="text" autocomplete="off" placeholder="Escribe tu respuesta…">
      <button class="btn btn-primary" type="submit">Enviar</button>
    </form>
    <div class="talk-actions">
      <button id="talk-voice" class="btn btn-primary" type="button">Hablar por voz</button>
      <button id="talk-text" class="btn btn-ghost" type="button">Usar texto</button>
      <button id="talk-end" class="btn btn-ghost" type="button" disabled>Terminar y guardar</button>
    </div>
    <p id="talk-note" class="talk-note"></p>
    <audio id="talk-audio" autoplay></audio>
  </aside>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
