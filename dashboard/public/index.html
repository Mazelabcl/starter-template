<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard v3 — &lt;project&gt;</title>
  <!-- Webfont pixel-art CC0 vía Google Fonts CDN (ADR-02). Solo se aplica al panel. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="loading">Dashboard v3 cargando…</div>
  <div id="game"></div>
  <!-- Topbar flotante. pointer-events:none en el contenedor; solo los botones capturan clicks. -->
  <div id="topbar">
    <button id="sprint-toggle" type="button" aria-label="Abrir vista de sprint">Sprint</button>
    <button id="roadmap-toggle" type="button" aria-label="Abrir vista de roadmap">Roadmap</button>
    <button id="chat-toggle" type="button" aria-label="Abrir chat público">Chat</button>
  </div>
  <aside id="panel"></aside>
  <script type="module" src="./boot.js"></script>
</body>
</html>
