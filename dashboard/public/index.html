<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Dashboard v3 — HTML plano de estado (v4: degradado desde el pixel-art Phaser). -->
  <title>Dashboard v3 — estado de agentes</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header id="topbar">
    <h1>Dashboard v3 <span id="conn-dot" class="conn-dot" title="conexión en vivo"></span></h1>
    <nav id="tabs">
      <button class="tab-btn tab-active" type="button" data-tab="tasks">Tareas</button>
      <button class="tab-btn" type="button" data-tab="sprint">Sprint</button>
      <button class="tab-btn" type="button" data-tab="roadmap">Roadmap</button>
      <button class="tab-btn" type="button" data-tab="chat">Chat</button>
    </nav>
    <div id="metrics-bar"></div>
  </header>

  <main>
    <section id="view-tasks" class="view view-active">
      <table id="tasks-table">
        <thead>
          <tr>
            <th>Agente</th>
            <th>Estado</th>
            <th>Modelo</th>
            <th>Tokens</th>
            <th>Summary</th>
          </tr>
        </thead>
        <tbody id="tasks-body"></tbody>
      </table>
      <div id="tasks-empty" class="empty">Sin tareas activas todavía.</div>
    </section>

    <section id="view-sprint" class="view"></section>
    <section id="view-roadmap" class="view"></section>
    <section id="view-chat" class="view"></section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
