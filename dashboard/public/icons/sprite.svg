<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Sprite 2.3a — 8 símbolos. Sprint 2.3b agrega 6 más para timeline/replay/export.
       Cada símbolo se referencia con <svg><use href="/icons/sprite.svg#id"/></svg>. -->

  <!-- estados de tarea -->
  <symbol id="i-task-start" viewBox="0 0 16 16">
    <polygon points="4,3 13,8 4,13" fill="currentColor"/>
  </symbol>
  <symbol id="i-task-complete" viewBox="0 0 16 16">
    <path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-task-failed" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M8 4.5v4M8 11h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>

  <!-- entidades del sistema -->
  <symbol id="i-agent" viewBox="0 0 16 16">
    <circle cx="8" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M3 13c1-2.5 3-3.5 5-3.5s4 1 5 3.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </symbol>
  <symbol id="i-skill" viewBox="0 0 16 16">
    <polygon points="8,1 10,6 15,6 11,9 12.5,14 8,11 3.5,14 5,9 1,6 6,6"
             fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-council" viewBox="0 0 16 16">
    <circle cx="5" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="11" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="8" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
  </symbol>
  <symbol id="i-image" viewBox="0 0 16 16">
    <rect x="2" y="3" width="12" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="6" cy="7" r="1" fill="currentColor"/>
    <path d="M2 11l3-3 4 4 3-2 2 2" fill="none" stroke="currentColor" stroke-width="1.2"/>
  </symbol>

  <!-- contador de tiempo -->
  <symbol id="i-clock" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <path d="M8 4.5V8l2.5 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

  <!-- ============== 2.3b: timeline / replay / export ============== -->

  <!-- replay: ícono de rebobinado para abrir el modal de replay -->
  <symbol id="i-replay" viewBox="0 0 16 16">
    <path d="M2 8a6 6 0 1 0 1.76-4.24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="2,2 2,6 6,6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- export: flecha hacia abajo dentro de bandeja, para descarga del log -->
  <symbol id="i-export" viewBox="0 0 16 16">
    <path d="M8 1.5v8.5M5 7.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M2.5 12v1.5h11V12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- decision: rombo (decisión emitida por el orquestador) -->
  <symbol id="i-decision" viewBox="0 0 16 16">
    <polygon points="8,1.5 14.5,8 8,14.5 1.5,8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
  </symbol>

  <!-- handoff: dos flechas que se cruzan (entrega de contrato entre agentes) -->
  <symbol id="i-handoff" viewBox="0 0 16 16">
    <path d="M2 5h9M8 2.5L11 5 8 7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 11H5M8 8.5L5 11l3 2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- search: lupa simple para input de búsqueda del timeline -->
  <symbol id="i-search" viewBox="0 0 16 16">
    <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M10.5 10.5L14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- chevron: flecha para colapsar/expandir el panel del timeline -->
  <symbol id="i-chevron" viewBox="0 0 16 16">
    <polyline points="3,6 8,11 13,6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
