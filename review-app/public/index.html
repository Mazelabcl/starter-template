<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review App — Sprint Reviewer</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>Sprint Reviewer</h1>
    <div id="health">cargando…</div>
  </header>
  <main>
    <aside id="sprints">
      <h2>Sprints</h2>
      <ul id="sprint-list"></ul>
    </aside>
    <section id="content">
      <div id="empty">selecciona un sprint y un bloque.</div>
      <div id="block-view" hidden>
        <h2 id="block-title"></h2>
        <pre id="block-content"></pre>
        <div id="tests"></div>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
